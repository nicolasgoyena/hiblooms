# Deployment of the HIBLOOMS viewer (React + FastAPI in a single container).
# A single service serves the web app and the API, so there is only one public link.
services:
  - type: web
    name: hiblooms
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free              # sleeps after 15 min without visits (~1 min to wake up)
    healthCheckPath: /api/health
    envVars:
      # Full JSON of the Google Earth Engine service account.
      # Without it, the service starts in demo mode with simulated data.
      - key: GEE_SERVICE_ACCOUNT_JSON
        sync: false
      # Web users: "user:password,other:other". If missing, the site is open.
      - key: HIBLOOMS_USERS
        sync: false
      # Long random string to sign sessions.
      - key: HIBLOOMS_SECRET
        generateValue: true
      # Project database (READ-ONLY user), see DATABASE.md.
      # Without it, the Data tab shows simulated data.
      - key: DATABASE_URL
        sync: false
      # Instance data folder (ephemeral on the free plan).
      - key: HIBLOOMS_DATA_DIR
        value: /data

