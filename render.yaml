services:
  - type: web
    name: hiblooms-api
    runtime: python
    pythonVersion: "3.11.9"
    buildCommand: pip install -r requirements_api.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEE_SERVICE_ACCOUNT_JSON
        sync: false
      # Conexión a PostgreSQL donde se persisten los jobs.
      # Formato: postgresql+psycopg2://usuario:password@host:5432/dbname
      - key: DATABASE_URL
        sync: false
      # Token compartido con la app. Debe coincidir con api_token en
      # .streamlit/secrets.toml del servicio hiblooms-app.
      - key: HIBLOOMS_API_TOKEN
        sync: false
      # Origen permitido por CORS (el dominio público de la app Streamlit).
      - key: APP_ORIGIN
        value: https://hiblooms-app.onrender.com

  - type: web
    name: hiblooms-app
    runtime: python
    pythonVersion: "3.11.9"
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: api_url
        value: https://hiblooms-api.onrender.com   # ← URL pública de la API
