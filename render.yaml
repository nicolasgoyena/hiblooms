# Despliegue del visor HIBLOOMS (React + FastAPI en un solo contenedor).
# Un único servicio sirve la web y la API, así que solo hay un enlace público.
services:
  - type: web
    name: hiblooms
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free              # se duerme a los 15 min sin visitas (~1 min en despertar)
    healthCheckPath: /api/health
    envVars:
      # JSON completo de la cuenta de servicio de Google Earth Engine.
      # Sin esto, el servicio arranca en modo demo con datos simulados.
      - key: GEE_SERVICE_ACCOUNT_JSON
        sync: false
      # Usuarios de la web: "usuario:contraseña,otro:otra". Si falta, queda abierta.
      - key: HIBLOOMS_USERS
        sync: false
      # Texto largo al azar para firmar las sesiones.
      - key: HIBLOOMS_SECRET
        generateValue: true
      # Carpeta de datos de la instancia (efímera en el plan gratuito).
      - key: HIBLOOMS_DATA_DIR
        value: /data

